spring:
  application:
    name: musichub

  datasource:
    url: jdbc:postgresql://localhost:5432/musichub
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # можно использовать validate в продакшене
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

jwt:
  secret: yourSuperSecretKey
  expiration: 86400000  # 1 day in milliseconds

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG